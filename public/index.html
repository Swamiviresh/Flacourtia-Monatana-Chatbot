<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flacourtia montana Conservation Assistant</title>
  <style>
    :root {
      --bg: #f4f7f2;
      --surface: #ffffff;
      --primary: #1b5e20;
      --primary-light: #e8f5e9;
      --accent: #c62828;
      --text: #1f2937;
      --muted: #5b6573;
      --border: #dce5d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 780px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 32px);
      max-height: 860px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(27, 94, 32, 0.08);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title-group h1 { font-size: 1.15rem; font-weight: 700; }
    .title-group p { font-size: 0.8rem; opacity: 0.9; margin-top: 2px; }
    .lang-bar { display: flex; gap: 6px; }
    .lang-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-btn.active {
      background: #fff;
      color: var(--primary);
      font-weight: 600;
    }
    .suggestions {
      padding: 10px 16px;
      background: #fafcf9;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #c8e6c9;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
    }
    .chip:hover { background: #d7eed9; }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.94rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #f6f8f5;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .credits {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #cfd8cc;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .credits strong { color: var(--primary); display: block; margin-bottom: 4px; }
    .credits a { color: #1565c0; text-decoration: none; }
    .credits a:hover { text-decoration: underline; }
    .credits li { margin-left: 16px; margin-bottom: 2px; }
    form.input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: #fff;
    }
    input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #cbd5c7;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    button.send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.send-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-group">
        <h1>Flacourtia montana Conservation Bot</h1>
        <p>SIT Tumakuru • Dr. Sree Sree Sivakumara Swamiji Biodiversity Park</p>
      </div>
      <div class="lang-bar">
        <button class="lang-btn active" data-lang="English">English</button>
        <button class="lang-btn" data-lang="Hindi">हिन्दी</button>
        <button class="lang-btn" data-lang="Kannada">ಕನ್ನಡ</button>
      </div>
    </header>

    <div class="suggestions" id="suggestions"></div>
    <div class="chat-box" id="chatBox"></div>

    <form class="input-bar" id="chatForm">
      <input type="text" id="questionInput" placeholder="Ask about Flacourtia montana or our 10-week project..." required />
      <button type="submit" class="send-btn" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const UI_TEXT = {
      English: {
        welcome: "Namaskara! Ask me anything about Flacourtia montana (Mountain Sweet Thorn), its medicinal uses, or our 10-week seedling conservation project at SIT Tumakuru.",
        placeholder: "Ask a question in English...",
        samples: [
          "Where is the 10-week conservation project located?",
          "How do you identify Flacourtia montana?",
          "What are the medicinal and food uses of the fruit?"
        ]
      },
      Hindi: {
        welcome: "नमस्कार! आप मुझसे Flacourtia montana पेड़, इसके औषधीय उपयोगों, या हमारे 10-सप्ताह के संरक्षण प्रोजेक्ट के बारे में पूछ सकते हैं।",
        placeholder: "हिन्दी में अपना प्रश्न लिखें...",
        samples: [
          "यह 10-सप्ताह का संरक्षण प्रोजेक्ट कहाँ स्थित है?",
          "Flacourtia montana के फल और औषधीय उपयोग क्या हैं?",
          "इस प्रोजेक्ट में 10 पौधों की देखभाल कैसे की जाती है?"
        ]
      },
      Kannada: {
        welcome: "ನಮಸ್ಕಾರ! Flacourtia montana (ಮೌಂಟೇನ್ ಸ್ವೀಟ್ ಥಾರ್ನ್) ಮರ, ಅದರ ಉಪಯೋಗಗಳು ಅಥವಾ ನಮ್ಮ 10 ವಾರಗಳ ಸಂರಕ್ಷಣಾ ಯೋಜನೆಯ ಬಗ್ಗೆ ಕೇಳಿ.",
        placeholder: "ಕನ್ನಡದಲ್ಲಿ ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಬರೆಯಿರಿ...",
        samples: [
          "ಈ 10 ವಾರಗಳ ಸಂರಕ್ಷಣಾ ಯೋಜನೆ ಎಲ್ಲಿದೆ?",
          "Flacourtia montana ಮರದ ಸ್ಥಳೀಯ ಹೆಸರುಗಳು ಮತ್ತು ಗುಣಲಕ್ಷಣಗಳು ಯಾವುವು?",
          "ಈ ಸಸಿಗಳ ನೀರು ಮತ್ತು ಕಳೆ ನಿರ್ವಹಣೆ ಹೇಗೆ ಮಾಡಲಾಗುತ್ತದೆ?"
        ]
      }
    };

    let currentLang = "English";
    const chatBox = document.getElementById("chatBox");
    const suggestionsEl = document.getElementById("suggestions");
    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      questionInput.placeholder = UI_TEXT[lang].placeholder;
      suggestionsEl.innerHTML = "";
      UI_TEXT[lang].samples.forEach(text => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = text;
        b.onclick = () => sendMessage(text);
        suggestionsEl.appendChild(b);
      });
    }

    function appendMessage(role, text, credits = []) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;

      if (role === "bot" && credits.length > 0) {
        const credDiv = document.createElement("div");
        credDiv.className = "credits";
        credDiv.innerHTML = "<strong>Sources &amp; Credits:</strong>";
        const ul = document.createElement("ul");
        credits.forEach(c => {
          const li = document.createElement("li");
          if (c.url && c.url.startsWith("http")) {
            const a = document.createElement("a");
            a.href = c.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = c.title || c.url;
            li.appendChild(a);
          } else {
            li.textContent = c.url ? `${c.title} (${c.url})` : c.title;
          }
          ul.appendChild(li);
        });
        credDiv.appendChild(ul);
        div.appendChild(credDiv);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      const q = text.trim();
      if (!q) return;
      appendMessage("user", q);
      questionInput.value = "";
      sendBtn.disabled = true;
      const loadingDiv = appendMessage("bot", "Thinking...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, language: currentLang })
        });
        const data = await res.json();
        loadingDiv.remove();
        appendMessage("bot", data.answer || data.error || "No response.", data.credits || []);
      } catch (err) {
        loadingDiv.remove();
        appendMessage("bot", "Network error: could not reach /api/chat.");
      } finally {
        sendBtn.disabled = false;
        questionInput.focus();
      }
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    document.getElementById("chatForm").addEventListener("submit", e => {
      e.preventDefault();
      sendMessage(questionInput.value);
    });

    setLanguage("English");
    appendMessage("bot", UI_TEXT.English.welcome);
  </script>
</body>
</html>
