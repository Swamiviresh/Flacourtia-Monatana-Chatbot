<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flacourtia Bot — Conservation Assistant</title>
  <style>
    :root {
      --white-heaven: #FEFEFE;
      --grim-white: #F4EFF7;
      --amour-frais: #F3E5EC;
      --orchid-haze: #D6CDD1;
      --flexible-grey: #B2A3A4;
      --stone-cold: #565656;
      --charcoal: #2B2B2B;
      --coral-send: #E87A5D;
      --coral-hover: #D9684B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--stone-cold);
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, var(--white-heaven) 0%, transparent 45%),
        radial-gradient(circle at 88% 82%, var(--amour-frais) 0%, transparent 55%),
        linear-gradient(135deg, var(--white-heaven) 0%, var(--grim-white) 50%, var(--amour-frais) 100%);
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .topbar {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--charcoal);
      color: var(--white-heaven);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 12px rgba(43, 43, 43, 0.16);
    }

    .brand-name {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--charcoal);
      letter-spacing: -0.01em;
    }

    .lang-bar {
      display: flex;
      gap: 6px;
      background: rgba(254, 254, 254, 0.72);
      border: 1px solid var(--orchid-haze);
      padding: 4px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--stone-cold);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn.active {
      background: var(--charcoal);
      color: var(--white-heaven);
      box-shadow: 0 2px 8px rgba(43, 43, 43, 0.15);
    }

    /* Main Container */
    .main {
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Hero Empty State */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 0 28px;
      gap: 32px;
    }

    .hero.hidden { display: none; }

    .hero-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 520px;
    }

    .hero-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--charcoal);
      color: var(--white-heaven);
      display: grid;
      place-items: center;
      margin-bottom: 6px;
      box-shadow: 0 10px 26px rgba(43, 43, 43, 0.18);
    }

    .hero-greeting {
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--flexible-grey);
      letter-spacing: -0.02em;
    }

    .hero-title {
      font-size: 1.95rem;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .hero-subtitle {
      font-size: 0.9rem;
      color: var(--flexible-grey);
      line-height: 1.5;
      margin-top: 2px;
    }

    /* 3 Prompt Cards */
    .cards-grid {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .prompt-card {
      background: rgba(254, 254, 254, 0.86);
      border: 1px solid rgba(214, 205, 209, 0.7);
      border-radius: 18px;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 138px;
      box-shadow: 0 6px 22px rgba(86, 86, 86, 0.05);
      backdrop-filter: blur(10px);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .prompt-card:hover {
      transform: translateY(-2px);
      border-color: var(--flexible-grey);
      box-shadow: 0 10px 28px rgba(86, 86, 86, 0.1);
    }

    .card-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--charcoal);
      color: var(--white-heaven);
      display: grid;
      place-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .card-tag {
      font-size: 0.74rem;
      color: var(--flexible-grey);
      font-weight: 500;
    }

    /* Chat Thread */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 8px 4px 20px;
    }

    .chat-box.active { display: flex; }

    .msg {
      max-width: 82%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.94rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--charcoal);
      color: var(--white-heaven);
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(43, 43, 43, 0.14);
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(254, 254, 254, 0.9);
      border: 1px solid var(--orchid-haze);
      color: var(--stone-cold);
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 16px rgba(86, 86, 86, 0.05);
      backdrop-filter: blur(8px);
    }

    .credits {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--orchid-haze);
      font-size: 0.78rem;
      color: var(--flexible-grey);
    }

    .credits strong {
      color: var(--stone-cold);
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .credits ul { list-style: none; display: flex; flex-direction: column; gap: 3px; }
    .credits a { color: #5b4b8a; text-decoration: none; font-weight: 500; }
    .credits a:hover { text-decoration: underline; }

    /* Floating Pill Input Bar */
    .input-wrap {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding-top: 8px;
    }

    .input-bar {
      background: var(--white-heaven);
      border: 1px solid var(--orchid-haze);
      border-radius: 999px;
      padding: 7px 8px 7px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 28px rgba(86, 86, 86, 0.08);
    }

    .input-bar input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.94rem;
      color: var(--charcoal);
      outline: none;
    }

    .input-bar input::placeholder { color: var(--flexible-grey); }

    .send-btn {
      background: var(--coral-send);
      color: var(--white-heaven);
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }

    .send-btn:hover { background: var(--coral-hover); }
    .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    @media (max-width: 680px) {
      .cards-grid { grid-template-columns: 1fr; }
      .prompt-card { min-height: auto; }
      .hero-title { font-size: 1.55rem; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="resetChat" title="Back to home">
      <div class="brand-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <span class="brand-name">Flacourtia Bot</span>
    </div>

    <div class="lang-bar">
      <button class="lang-btn active" data-lang="English">English</button>
      <button class="lang-btn" data-lang="Hindi">हिन्दी</button>
      <button class="lang-btn" data-lang="Kannada">ಕನ್ನಡ</button>
    </div>
  </header>

  <main class="main">
    <section class="hero" id="hero">
      <div class="hero-header">
        <div class="hero-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <div class="hero-greeting" id="heroGreeting">Namaskara, Conservation Team</div>
        <h1 class="hero-title" id="heroTitle">Can I help you with anything?</h1>
        <p class="hero-subtitle" id="heroSubtitle">
          Ask about Flacourtia montana, botanical traits, or our 10-week SIT Tumakuru project.
        </p>
      </div>

      <div class="cards-grid" id="cardsGrid"></div>
    </section>

    <section class="chat-box" id="chatBox"></section>

    <div class="input-wrap">
      <form class="input-bar" id="chatForm">
        <input type="text" id="questionInput" placeholder="Ask Flacourtia Bot anything..." required />
        <button type="submit" class="send-btn" id="sendBtn">
          <span id="sendLabel">Send</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <script>
    const ICONS = [
      `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
      `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>`,
      `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`
    ];

    const UI_TEXT = {
      English: {
        greeting: "Namaskara, Conservation Team",
        title: "Can I help you with anything?",
        subtitle: "Ask about Flacourtia montana, botanical traits, or our 10-week SIT Tumakuru project.",
        placeholder: "Ask Flacourtia Bot anything...",
        send: "Send",
        cards: [
          { title: "Where is the 10-week project located?", tag: "Project Overview", query: "Where is the 10-week conservation project located and who are the participants?" },
          { title: "How do you identify Flacourtia montana?", tag: "Botanical ID", query: "How do you identify Flacourtia montana?" },
          { title: "Medicinal & food uses of the fruit", tag: "Uses & Ecology", query: "What are the medicinal and food uses of Flacourtia montana?" }
        ]
      },
      Hindi: {
        greeting: "नमस्कार, संरक्षण टीम",
        title: "मैं आपकी क्या मदद कर सकता हूँ?",
        subtitle: "Flacourtia montana, इसके उपयोग या हमारे 10-सप्ताह के SIT तुमकुरु प्रोजेक्ट के बारे में पूछें।",
        placeholder: "हिन्दी में अपना प्रश्न पूछें...",
        send: "भेजें",
        cards: [
          { title: "10-सप्ताह का प्रोजेक्ट कहाँ स्थित है?", tag: "प्रोजेक्ट विवरण", query: "यह 10-सप्ताह का संरक्षण प्रोजेक्ट कहाँ स्थित है और इसके प्रतिभागी कौन हैं?" },
          { title: "Flacourtia montana की पहचान कैसे करें?", tag: "वनस्पति पहचान", query: "Flacourtia montana पेड़ की पहचान कैसे की जाती है?" },
          { title: "फल के औषधीय और खाद्य उपयोग", tag: "उपयोग और महत्व", query: "Flacourtia montana के फल और औषधीय उपयोग क्या हैं?" }
        ]
      },
      Kannada: {
        greeting: "ನಮಸ್ಕಾರ, ಸಂರಕ್ಷಣಾ ತಂಡ",
        title: "ನಾನು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ?",
        subtitle: "Flacourtia montana, ಅದರ ಗುಣಲಕ್ಷಣಗಳು ಅಥವಾ ನಮ್ಮ 10 ವಾರಗಳ SIT ತುಮಕೂರು ಯೋಜನೆಯ ಬಗ್ಗೆ ಕೇಳಿ.",
        placeholder: "ಕನ್ನಡದಲ್ಲಿ ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಕೇಳಿ...",
        send: "ಕಳುಹಿಸಿ",
        cards: [
          { title: "10 ವಾರಗಳ ಯೋಜನೆ ಎಲ್ಲಿದೆ?", tag: "ಯೋಜನೆಯ ವಿವರ", query: "ಈ 10 ವಾರಗಳ ಸಂರಕ್ಷಣಾ ಯೋಜನೆ ಎಲ್ಲಿದೆ ಮತ್ತು ಭಾಗವಹಿಸುವವರು ಯಾರು?" },
          { title: "Flacourtia montana ಗುರುತಿಸುವುದು ಹೇಗೆ?", tag: "ಸಸ್ಯ ಗುರುತಿಸುವಿಕೆ", query: "Flacourtia montana ಮರದ ಸ್ಥಳೀಯ ಹೆಸರುಗಳು ಮತ್ತು ಗುಣಲಕ್ಷಣಗಳು ಯಾವುವು?" },
          { title: "ಹಣ್ಣಿನ ಔಷಧೀಯ ಮತ್ತು ಆಹಾರ ಉಪಯೋಗಗಳು", tag: "ಉಪಯೋಗಗಳು", query: "Flacourtia montana ಹಣ್ಣಿನ ಔಷಧೀಯ ಮತ್ತು ಆಹಾರ ಉಪಯೋಗಗಳು ಯಾವುವು?" }
        ]
      }
    };

    const STORAGE_KEY = "flacourtia_chat_history";
    const LANG_KEY = "flacourtia_chat_lang";
    let currentLang = "English";
    let chatHistory = [];
    const heroEl = document.getElementById("hero");
    const chatBox = document.getElementById("chatBox");
    const cardsGrid = document.getElementById("cardsGrid");
    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");

    function setLanguage(lang) {
      if (!UI_TEXT[lang]) lang = "English";
      currentLang = lang;
      localStorage.setItem(LANG_KEY, lang);
      const t = UI_TEXT[lang];
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      document.getElementById("heroGreeting").textContent = t.greeting;
      document.getElementById("heroTitle").textContent = t.title;
      document.getElementById("heroSubtitle").textContent = t.subtitle;
      document.getElementById("sendLabel").textContent = t.send;
      questionInput.placeholder = t.placeholder;

      cardsGrid.innerHTML = "";
      t.cards.forEach((c, idx) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "prompt-card";
        card.innerHTML = `
          <div class="card-icon">${ICONS[idx]}</div>
          <div>
            <div class="card-title">${c.title}</div>
            <div class="card-tag">${c.tag}</div>
          </div>
        `;
        card.onclick = () => sendMessage(c.query);
        cardsGrid.appendChild(card);
      });
    }

    function appendMessage(role, text, credits = [], save = true) {
      heroEl.classList.add("hidden");
      chatBox.classList.add("active");

      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;

      if (role === "bot" && credits.length > 0) {
        const credDiv = document.createElement("div");
        credDiv.className = "credits";
        credDiv.innerHTML = "<strong>Sources &amp; Credits</strong>";
        const ul = document.createElement("ul");
        credits.forEach(c => {
          const li = document.createElement("li");
          if (c.url && c.url.startsWith("http")) {
            const a = document.createElement("a");
            a.href = c.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = "↗ " + (c.title || c.url);
            li.appendChild(a);
          } else {
            li.textContent = "• " + (c.url ? `${c.title} (${c.url})` : c.title);
          }
          ul.appendChild(li);
        });
        credDiv.appendChild(ul);
        div.appendChild(credDiv);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      if (save) {
        chatHistory.push({ role, text, credits });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
      }
      return div;
    }

    async function sendMessage(text) {
      const q = text.trim();
      if (!q) return;
      appendMessage("user", q);
      questionInput.value = "";
      sendBtn.disabled = true;
      const loadingDiv = appendMessage("bot", "Thinking...", [], false);

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, language: currentLang })
        });
        const data = await res.json();
        loadingDiv.remove();
        appendMessage("bot", data.answer || data.error || "No response.", data.credits || []);
      } catch (err) {
        loadingDiv.remove();
        appendMessage("bot", "Network error: could not reach /api/chat.", [], false);
      } finally {
        sendBtn.disabled = false;
        questionInput.focus();
      }
    }

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    document.getElementById("chatForm").addEventListener("submit", e => {
      e.preventDefault();
      sendMessage(questionInput.value);
    });

    document.getElementById("resetChat").addEventListener("click", () => {
      chatHistory = [];
      localStorage.removeItem(STORAGE_KEY);
      chatBox.innerHTML = "";
      chatBox.classList.remove("active");
      heroEl.classList.remove("hidden");
    });

    setLanguage(localStorage.getItem(LANG_KEY) || "English");
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (Array.isArray(saved) && saved.length > 0) {
        chatHistory = saved;
        saved.forEach(m => appendMessage(m.role, m.text, m.credits || [], false));
      }
    } catch (e) { localStorage.removeItem(STORAGE_KEY); }
  </script>
</body>
</html>
